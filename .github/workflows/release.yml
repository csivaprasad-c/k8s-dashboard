name: Release

# Push a tag like v1.2.3 to build k8sdash for windows/amd64, darwin/arm64,
# and linux/arm64 and publish a GitHub Release with the archives (plus a
# checksums.txt and an auto-generated changelog) attached — see
# .goreleaser.yaml for exactly what gets built/published.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history for the changelog and `git describe`

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
